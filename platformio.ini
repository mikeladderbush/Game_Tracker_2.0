; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:adafruit_matrixportal_esp32s3]
platform = espressif32
board = adafruit_matrixportal_esp32s3
framework = arduino

lib_deps = 
    adafruit/Adafruit Protomatter
    bblanchon/ArduinoJson

monitor_port = COM8
monitor_speed = 115200

; Host-native unit tests - no board needed, runs on your dev machine.
; Only pure-logic files are compiled. Excluded: main.cpp (setup/loop +
; WiFi/FreeRTOS), common/display.cpp/common/draw_tools.cpp
; (Adafruit_Protomatter), common/http_fetch.cpp/common/ntp_time.cpp
; (WiFiClientSecure/HTTPClient/configTzTime - ESP32-only, no native
; equivalent), nba/control_server.cpp/nba/nba_api_client.cpp/
; nba/game_state.cpp (same ESP32-only networking, plus WebServer.h for
; control_server), nba/nba_menu.cpp (pulls in common/draw_tools.h ->
; Adafruit_Protomatter transitively), and the NFL equivalents
; nfl/nfl_api_client.cpp/nfl/nfl_menu.cpp (same reasons as their nba/
; counterparts - nfl_api_client.cpp needs common/http_fetch.h's networking,
; nfl_menu.cpp needs common/draw_tools.h's Adafruit_Protomatter). Pure logic
; lives in common/time_formatting.cpp, common/clock_sync.cpp,
; common/draw_formatting.cpp, common/glyph_data.cpp,
; nba/nba_teams.cpp/nba/nba_team_data.cpp, nba/nba_team_ids.cpp, and
; nfl/nfl_teams.cpp/nfl/nfl_team_data.cpp instead, which ARE compiled here.
[env:native]
platform = native
test_framework = unity
; PlatformIO doesn't link src/ into test binaries by default (it assumes
; main.cpp would conflict with the test's own main()) - since main.cpp is
; excluded below anyway, turn this on so the pure-logic .cpp files actually
; get compiled and linked into each test.
test_build_src = yes
build_src_filter =
    +<*>
    -<main.cpp>
    -<common/display.cpp>
    -<common/draw_tools.cpp>
    -<common/http_fetch.cpp>
    -<common/ntp_time.cpp>
    -<nba/control_server.cpp>
    -<nba/nba_api_client.cpp>
    -<nba/game_state.cpp>
    -<nba/nba_menu.cpp>
    -<nfl/nfl_api_client.cpp>
    -<nfl/nfl_menu.cpp>
lib_deps =
    fabiobatsilva/ArduinoFake@^0.4.0
build_flags =
    -std=gnu++17
    -DUNIT_TEST